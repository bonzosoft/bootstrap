name: Fetch and Package Modules

on:
  push:
    # Run workflow when the 'version' file is updated
    paths:
      - 'version'
    branches:
      - main
  # Run on demmand
  workflow_dispatch:

# Permissions for commits in bootstrap
permissions:
  contents: write

jobs:
  fetch-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checktout current bootstrap repository
        uses: actions/checkout@v7
        with:
          path: bootstrap

      - name: 📖 Get version for common repository 
        id: read_version
        shell: pwsh
        run: |
          $commitId = (Get-Content -Path "./bootstrap/version" -Raw).Trim()
          
          Write-Output "Se solicitó el commit/tag: $commitId"
          
          Add-Content -Path $env:GITHUB_OUTPUT -Value "ref_target=$commitId"

      - name: 📥 Checkout required common repository
        uses: actions/checkout@v7
        with:
          repository: bonzosoft/common
          path: common
          ref: ${{ steps.read_version.outputs.ref_target }}
          token: ${{ secrets.CONTENTS_READONLY_COMMONS }}
          fetch-depth: 0

      - name: 🗜️ Adding modules to archive
        shell: pwsh
        run: |
          Write-Output "Comprimiendo módulos..."
          Compress-Archive -Path ./common/modules/* -DestinationPath ./bootstrap/modules.zip -Force

      - name: 📤 Commit changes to bootstrap
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: bootstrap
          commit_message: "Update PowerShell modules"
          file_pattern: modules.zip
