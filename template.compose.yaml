## HARDENING ###################################################################
x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
    - apparmor:docker-default
  cap_drop:
    - ALL
  cap_add: []
    ### DEFAULT DOCKER CAPABILITIES (Enabled by default in standard containers)
    #- DAC_OVERRIDE      # Bypass file read, write, and execute permission checks.
    #- SETGID            # Make arbitrary manipulations of process GIDs.
    #- SETUID            # Make arbitrary manipulations of process UIDs.
    #- CHOWN             # Make arbitrary changes to file UIDs and GIDs.
    #- FOWNER            # Make arbitrary changes to file owner.
    #- FSETID            # Don't clear setuid/setgid bits when a file is modified.
    #- NET_BIND_SERVICE  # Bind a socket to Internet domain privileged ports (<1024).
    #- NET_RAW           # Use RAW and PACKET sockets (e.g., for ping/ICMP).
    #- KILL              # Kill processes.
    #- SETPCAP           # Modify process capabilities.
    #- SYS_CHROOT        # Use chroot().
    #- MKNOD             # Create special files using mknod.
    #- AUDIT_WRITE       # Write records to kernel auditing log.
    #- SETFCAP           # Set file capabilities.
    ### PRIVILEGED CAPABILITIES (Not enabled by default)
    #- NET_ADMIN         # Network operations (firewalls, routing, QUIC BPF).
    #- SYS_ADMIN         # Extreme "catch-all" for sysadmin operations.
    #- SYS_MODULE        # Load and unload kernel modules.
    #- SYS_PTRACE        # Trace arbitrary processes using ptrace().
    #- SYS_NICE          # Raise process scheduling priority.
    #- IPC_LOCK          # Lock memory to prevent swapping.
    #- SYS_TIME          # Set system clock.
    #- SYS_RAWIO         # Perform I/O port operations.
    #- DAC_READ_SEARCH   # Bypass file read and directory search checks.

