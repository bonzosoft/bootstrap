## SERVICES ####################################################################
services:
  ##--- APP ------------------------------------------------------------------##
  app:
    ##--- GENERAL -------------------##
    image: :${APP_VERSION:-}
    user: ${APP_PUID:-${PUID}}:${APP_PGID:-${PGID}}
    restart: unless-stopped
    <<:
      - *resources
      - *hardening
    depends_on:
      webproxy:
         condition: service_healthy
    #entrypoint: ["sh", "-c"]
    #command:
      #- |
      #
      #
      #
      #
      #
      #
      #
      #
      #
      #
      #
      #
      #
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:${APP_PORT:?}"]
      interval:        30s
      timeout:          3s
      start_period:    60s
      start_interval:   5s
      retries:          3
    stop_grace_period: 15s

    ##--- NETWORK -------------------##
    hostname: ${PROJECTNAME}-${SERVER_HOSTNAME:?}
    #network_mode: bridge # bridge|host|none|service:[servicename]|container:[containername]
    networks:
      internal:
        aliases:
          - ${APP_HOSTNAME:?}
      #backup:
        #aliases:
        #  - ${APP_HOSTNAME:?}
    expose:
      - ${APP_PORT:?}
      #- 
    ports: []
      #- 0.0.0.0:${APP_EXT_PORT:?}:${APP_EXT_PORT:?}
      #- 0.0.0.0:
    extra_hosts: {}
      #- host.docker.internal:host-gateway
      #- 

    ##--- STORAGE -------------------##
    volumes:
      - ${DATADIR:?}/app/config:/config/:rw
      #-
      #-
      #-
      #-
      #-
      #-
      #-
      #-
      #-
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
      #- /var/run:rw,noexec,nosuid,nodev,mode=0775,uid=${APP_PUID:-${PUID}},gid=${APP_PGID:-${PGID}}
      #-
      #-
      #-
      #-

    ##--- CONFIGURATION -------------##
    secrets: []
      #-
      #-
      #-
      #-
      #-
      #-
    configs: []
      #- source:
      #  target:
      #- source:
      #  target:
    environment:
      TZ:                                   Europe/Madrid
